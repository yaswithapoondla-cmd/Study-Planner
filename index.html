<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Study Planner - Plan your studies, set subject goals, track priorities, and monitor your academic progress with an intuitive dashboard.">
    <title>Smart Study Planner | Plan Your Studies, Track Your Progress</title>
    
    <!-- Google Fonts for clean modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- React Root Mount Container -->
    <div id="root">
        <noscript>
            <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
                <h2>JavaScript Required</h2>
                <p>Please enable JavaScript to run Smart Study Planner.</p>
            </div>
        </noscript>
    </div>

    <!-- React 18, ReactDOM, and Babel Standalone CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React Application Script (Babel compiled) -->
    <script type="text/babel" src="script.js"></script>

    <!-- Graceful file:// protocol handler for Chromium browsers -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var root = document.getElementById('root');
                if (root && root.children.length === 0 && window.location.protocol === 'file:') {
                    root.innerHTML = '<div style="max-width: 600px; margin: 4rem auto; padding: 2rem; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; text-align: center; color: #1e293b;">' +
                        '<div style="width: 48px; height: 48px; border-radius: 10px; background: #eef2ff; color: #4f46e5; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem; font-size: 1.5rem;">⚛️</div>' +
                        '<h2 style="color: #1e293b; margin-bottom: 0.5rem; font-size: 1.25rem;">Smart Study Planner (React 18)</h2>' +
                        '<p style="color: #64748b; line-height: 1.5; font-size: 0.9rem; margin-bottom: 1.25rem;">Chromium blocks external Babel JSX compilation when opened directly via <code>file://</code> protocol.</p>' +
                        '<div style="background: #f8fafc; padding: 1rem 1.25rem; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.85rem; text-align: left; line-height: 1.6; color: #334155;">' +
                        '<strong>How to run locally:</strong><br>' +
                        '&bull; <strong>VS Code:</strong> Right-click <code>index.html</code> &rarr; <em>Open with Live Server</em><br>' +
                        '&bull; <strong>Terminal:</strong> Run <code>npx serve</code> or <code>python -m http.server</code><br>' +
                        '&bull; <strong>Firefox:</strong> Double-click <code>index.html</code> to open directly.' +
                        '</div>' +
                        '</div>';
                }
            }, 1200);
        });
    </script>
</body>
</html>
